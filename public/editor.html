<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استودیو ویرایش جزوه زنده | Editor</title>
  <link rel="stylesheet" href="./css/katex.min.css" />
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('./fonts/Vazirmatn.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --card: #1e293b;
      --border: rgba(148, 163, 184, 0.2);
      --accent: #6366f1;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }
    .katex, .katex-display {
      direction: ltr !important;
      unicode-bidi: isolate !important;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn.secondary { background: var(--card); border: 1px solid var(--border); }
    .btn.success { background: var(--emerald); }
    .btn.danger { background: #ef4444; padding: 5px 10px; font-size: 0.75rem; }
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) { .grid-layout { grid-template-columns: 1fr; } }
    .section-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #a5b4fc;
    }
    .item-editor {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 3px;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    textarea { min-height: 62px; resize: vertical; }
    .live-preview {
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.86rem;
      margin-top: 4px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #fcd34d;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1 style="font-size: 1.15rem;">🛠️ استودیو بازبینی و ویرایش چشمی «جزوه زنده»</h1>
      <p style="font-size: 0.78rem; color: var(--muted);">تایید ۵ دقیقه‌ای فرمول‌ها (KaTeX) و سوالات قبل از انتشار در ربات تلگرام</p>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="importJsonFile(event)" />
      <button class="btn secondary" onclick="document.getElementById('jsonFileInput').click()">📂 بارگذاری فایل JSON</button>
      <button class="btn success" onclick="exportCleanJson()">💾 دانلود JSON نهایی</button>
    </div>
  </div>

  <!-- مشخصات کلی درس -->
  <div class="section-box">
    <div class="section-title">۱. مشخصات پکیج درسی</div>
    <div class="field-row">
      <div>
        <label>شناسه درس (Course ID)</label>
        <input type="text" id="meta_id" oninput="updateMeta()" />
      </div>
      <div>
        <label>عنوان پکیج</label>
        <input type="text" id="meta_title" oninput="updateMeta()" />
      </div>
      <div>
        <label>استاد / منبع</label>
        <input type="text" id="meta_instructor" oninput="updateMeta()" />
      </div>
      <div>
        <label>گردآورنده (دانشجوی سازنده)</label>
        <input type="text" id="meta_creator" oninput="updateMeta()" />
      </div>
      <div>
        <label>قیمت پکیج (تومان)</label>
        <input type="number" id="meta_price" oninput="updateMeta()" />
      </div>
    </div>
  </div>

  <div class="grid-layout">
    <!-- ستون راست: فرمول‌نامه و فلش‌کارت‌ها -->
    <div>
      <div class="section-box">
        <div class="section-title">
          <span>۲. خلاصه و فرمول‌نامه (Cheat Sheet)</span>
          <button class="btn" onclick="addSummaryItem()">+ افزودن فرمول</button>
        </div>
        <div id="summaryEditorList"></div>
      </div>

      <div class="section-box">
        <div class="section-title">
          <span>۳. فلش‌کارت‌های لایتنر (Flashcards)</span>
          <button class="btn" onclick="addFlashcardItem()">+ افزودن کارت</button>
        </div>
        <div id="flashcardsEditorList"></div>
      </div>
    </div>

    <!-- ستون چپ: سوالات امتحانی -->
    <div>
      <div class="section-box">
        <div class="section-title">
          <span>۴. بانک سوالات امتحانی (Exam Questions)</span>
          <button class="btn" onclick="addExamQuestion()">+ افزودن سوال</button>
        </div>
        <div id="questionsEditorList"></div>
      </div>
    </div>
  </div>

  <script src="./js/katex.min.js"></script>
  <script>
    let courseData = null;

    function sanitizeLatex(str) {
      if (!str) return '';
      return str.replace(/\f/g, '\\f').replace(/\t/g, '\\t').replace(/\x08/g, '\\b');
    }

    function renderMathPreview(text) {
      if (!text) return '';
      let out = sanitizeLatex(text);
      out = out.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => {
        try { return katex.renderToString(m.trim(), { displayMode: true, throwOnError: false }); }
        catch (_) { return m; }
      });
      out = out.replace(/\$([^\$]+?)\$/g, (_, m) => {
        try { return katex.renderToString(m.trim(), { displayMode: false, throwOnError: false }); }
        catch (_) { return m; }
      });
      return out.replace(/\n/g, '<br>');
    }

    async function loadDefaultCourse() {
      const res = await fetch('./data/sample_course.json');
      courseData = await res.json();
      renderAllEditors();
    }

    function renderAllEditors() {
      document.getElementById('meta_id').value = courseData.id || '';
      document.getElementById('meta_title').value = courseData.title || '';
      document.getElementById('meta_instructor').value = courseData.instructor || '';
      document.getElementById('meta_creator').value = courseData.creator || '';
      document.getElementById('meta_price').value = courseData.price_toman || 59000;

      renderSummaryEditor();
      renderFlashcardsEditor();
      renderQuestionsEditor();
    }

    function updateMeta() {
      courseData.id = document.getElementById('meta_id').value;
      courseData.title = document.getElementById('meta_title').value;
      courseData.instructor = document.getElementById('meta_instructor').value;
      courseData.creator = document.getElementById('meta_creator').value;
      courseData.price_toman = Number(document.getElementById('meta_price').value);
    }

    function renderSummaryEditor() {
      const el = document.getElementById('summaryEditorList');
      el.innerHTML = courseData.summary_cheat_sheet.map((item, idx) => `
        <div class="item-editor">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <strong>فرمول #${idx + 1}</strong>
            <button class="btn danger" onclick="courseData.summary_cheat_sheet.splice(${idx},1); renderSummaryEditor();">حذف</button>
          </div>
          <div class="field-row">
            <div>
              <label>عنوان مبحث</label>
              <input type="text" value="${item.topic}" oninput="courseData.summary_cheat_sheet[${idx}].topic = this.value" />
            </div>
            <div>
              <label>صفحه جزوه</label>
              <input type="number" value="${item.source_page}" oninput="courseData.summary_cheat_sheet[${idx}].source_page = Number(this.value)" />
            </div>
          </div>
          <label>فرمول LaTeX (بدون علامت $)</label>
          <input type="text" dir="ltr" value="${item.formula_latex.replace(/"/g, '&quot;')}" oninput="courseData.summary_cheat_sheet[${idx}].formula_latex = this.value; updateFormulaPreview(${idx})" />
          <div class="live-preview" id="sum_prev_${idx}">
            ${renderMathPreview('$$' + item.formula_latex + '$$')}
          </div>
        </div>
      `).join('');
    }

    function updateFormulaPreview(idx) {
      const latex = courseData.summary_cheat_sheet[idx].formula_latex;
      document.getElementById(`sum_prev_${idx}`).innerHTML = renderMathPreview('$$' + latex + '$$');
    }

    function addSummaryItem() {
      courseData.summary_cheat_sheet.push({
        id: 'sum_' + Date.now(),
        topic: 'مبحث جدید',
        key_points: ['نکته کلیدی اول'],
        formula_latex: '\\Delta G = 0',
        source_page: 1
      });
      renderSummaryEditor();
    }

    function renderFlashcardsEditor() {
      const el = document.getElementById('flashcardsEditorList');
      el.innerHTML = courseData.flashcards.map((fc, idx) => `
        <div class="item-editor">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong>فلش‌کارت #${idx + 1}</strong>
            <label class="checkbox-label">
              <input type="checkbox" ${fc.is_locked ? 'checked' : ''} onchange="courseData.flashcards[${idx}].is_locked = this.checked" />
              🔒 قفل (مخصوص نسخه پولی)
            </label>
            <button class="btn danger" onclick="courseData.flashcards.splice(${idx},1); renderFlashcardsEditor();">حذف</button>
          </div>
          <label>روی کارت (سوال - فرمول‌ها بین $...$)</label>
          <textarea oninput="courseData.flashcards[${idx}].front = this.value; updateCardPreview(${idx})">${fc.front}</textarea>
          <label>پشت کارت (پاسخ)</label>
          <textarea oninput="courseData.flashcards[${idx}].back = this.value; updateCardPreview(${idx})">${fc.back}</textarea>
          <div class="live-preview" id="fc_prev_${idx}">
            <strong>پیش‌نمایش:</strong> ${renderMathPreview(fc.front)} <hr style="margin:6px 0; opacity:0.2;"> ${renderMathPreview(fc.back)}
          </div>
        </div>
      `).join('');
    }

    function updateCardPreview(idx) {
      const fc = courseData.flashcards[idx];
      document.getElementById(`fc_prev_${idx}`).innerHTML =
        `<strong>پیش‌نمایش:</strong> ${renderMathPreview(fc.front)} <hr style="margin:6px 0; opacity:0.2;"> ${renderMathPreview(fc.back)}`;
    }

    function addFlashcardItem() {
      courseData.flashcards.push({
        id: 'fc_' + Date.now(),
        is_locked: true,
        front: 'سوال جدید با فرمول $T_m$؟',
        back: 'پاسخ کارت جدید',
        source_page: 10
      });
      renderFlashcardsEditor();
    }

    function renderQuestionsEditor() {
      const el = document.getElementById('questionsEditorList');
      el.innerHTML = courseData.exam_questions.map((q, idx) => `
        <div class="item-editor">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong>سوال امتحانی #${idx + 1}</strong>
            <label class="checkbox-label">
              <input type="checkbox" ${q.is_locked ? 'checked' : ''} onchange="courseData.exam_questions[${idx}].is_locked = this.checked" />
              🔒 قفل (مخصوص نسخه پولی)
            </label>
            <button class="btn danger" onclick="courseData.exam_questions.splice(${idx},1); renderQuestionsEditor();">حذف</button>
          </div>
          <label>صورت سوال</label>
          <textarea oninput="courseData.exam_questions[${idx}].question_stem = this.value; updateQuestionPreview(${idx})">${q.question_stem}</textarea>
          <label>پاسخ تشریحی استاد</label>
          <textarea oninput="courseData.exam_questions[${idx}].explanation = this.value; updateQuestionPreview(${idx})">${q.explanation}</textarea>
          <div class="live-preview" id="q_prev_${idx}">
            ${renderMathPreview(q.question_stem)}<br><br>
            <span style="color:#34d399;">پاسخ:</span> ${renderMathPreview(q.explanation)}
          </div>
        </div>
      `).join('');
    }

    function updateQuestionPreview(idx) {
      const q = courseData.exam_questions[idx];
      document.getElementById(`q_prev_${idx}`).innerHTML =
        `${renderMathPreview(q.question_stem)}<br><br><span style="color:#34d399;">پاسخ:</span> ${renderMathPreview(q.explanation)}`;
    }

    function addExamQuestion() {
      courseData.exam_questions.push({
        id: 'q_' + Date.now(),
        is_locked: true,
        question_stem: 'صورت سوال امتحانی جدید...',
        options: ['گزینه ۱', 'گزینه ۲', 'گزینه ۳', 'گزینه ۴'],
        correct_index: 0,
        explanation: 'پاسخ تشریحی سوال...',
        source_page: 20
      });
      renderQuestionsEditor();
    }

    function importJsonFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        courseData = JSON.parse(e.target.result);
        renderAllEditors();
      };
      reader.readAsText(file);
    }

    function exportCleanJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(courseData, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `${courseData.id || 'course'}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    loadDefaultCourse();
  </script>
</body>
</html>
